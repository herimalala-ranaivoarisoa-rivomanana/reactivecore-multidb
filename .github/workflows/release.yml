name: Build and release ReactiveCore MultiDB alpha

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local_mysql_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - '3306/tcp'
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 4s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify the release version
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/client/package.json').version")"
          cmp LICENSE packages/client/LICENSE
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test packages/client/test/offline.test.mjs
      - name: Build and archive the release artifacts
        run: |
          set -o pipefail
          mkdir dist-release
          npm pack -w @reactivecore/client --pack-destination dist-release
          docker build --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --platform linux/amd64 -t "reactivecore-multidb:$GITHUB_REF_NAME" .
          docker save "reactivecore-multidb:$GITHUB_REF_NAME" | gzip -n > "dist-release/reactivecore-multidb-$GITHUB_REF_NAME-linux-amd64.tar.gz"
          docker image rm "reactivecore-multidb:$GITHUB_REF_NAME"
          docker load -i "dist-release/reactivecore-multidb-$GITHUB_REF_NAME-linux-amd64.tar.gz"
      - run: node scripts/test-infra.mjs
      - name: Build the browser example with the packaged SDK
        working-directory: examples/next-offline-conflicts
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          sdk_archive="../../dist-release/reactivecore-client-${GITHUB_REF_NAME#v}.tgz"
          npm install --no-save --package-lock=false "$sdk_archive"
          test "$(node -p "require('./node_modules/@reactivecore/client/package.json').version")" = "${GITHUB_REF_NAME#v}"
          test ! -L node_modules/@reactivecore/client
          npm run build
      - name: Load the published MySQL upgrade baseline
        run: bash scripts/load-mysql-upgrade-baseline.sh
      - name: Verify packaged SDK and runtime image on PostgreSQL and MySQL
        env:
          RC_BROWSER_CONFLICT_TEST: '1'
          RC_MYSQL_UPGRADE_IMAGE: reactivecore-multidb:v0.2.0-alpha.1
          RC_MYSQL_TEST_CONTAINER: ${{ job.services.mysql.id }}
          RC_MYSQL_TEST_URL: mysql://root:local_mysql_test@127.0.0.1:${{ job.services.mysql.ports[3306] }}
        run: |
          export RC_TEST_IMAGE="reactivecore-multidb:$GITHUB_REF_NAME"
          export RC_TEST_SDK_ARCHIVE="dist-release/reactivecore-client-${GITHUB_REF_NAME#v}.tgz"
          export RC_TEST_CHROMIUM="$(command -v google-chrome || command -v chromium)"
          (cd examples/next-offline-conflicts && exec node node_modules/serve/build/main.js out -l tcp://127.0.0.1:4173 --no-clipboard) &
          frontend_pid=$!
          trap 'kill "$frontend_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/ -o /dev/null
          node --env-file=.env.reactivecore-test scripts/test-project.mjs
          node --env-file=.env.reactivecore-test scripts/test-mysql-project.mjs
      - name: Include release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [ -f "$notes" ]; then cp "$notes" dist-release/RELEASE_NOTES.md; fi
      - name: Write checksums
        working-directory: dist-release
        run: sha256sum ./*.tgz ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reactivecore-release
          path: dist-release/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reactivecore-release
          path: dist-release
      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist-release && sha256sum -c SHA256SUMS)
          notes=(--generate-notes)
          if [ -f dist-release/RELEASE_NOTES.md ]; then notes=(--notes-file dist-release/RELEASE_NOTES.md); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease "${notes[@]}" \
            dist-release/*.tgz dist-release/*.tar.gz dist-release/SHA256SUMS
