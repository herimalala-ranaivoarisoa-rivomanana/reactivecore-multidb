name: Validate ReactiveCore
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local_mysql_test
          MYSQL_ROOT_HOST: '%'
        ports:
          - '3306/tcp'
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 4s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test packages/client/test/offline.test.mjs
      - run: npm test
      - run: node scripts/test-infra.mjs
      - run: node --env-file=.env.reactivecore-test scripts/test-project.mjs
      - name: Verify managed PostgreSQL provisioning
        run: RC_TEST_MANAGED_DATABASE=1 node --env-file=.env.reactivecore-test scripts/test-project.mjs
      - name: Verify MySQL project
        env:
          RC_MYSQL_TEST_URL: mysql://root:local_mysql_test@127.0.0.1:${{ job.services.mysql.ports[3306] }}
        run: node --env-file=.env.reactivecore-test scripts/test-mysql-project.mjs
